<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/>
    </marker>
  </defs>

  <rect width="1400" height="860" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Multi-User Secure Chat Service — Architecture</text>

  <!-- ================= CLIENTS ================= -->
  <text x="200" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F3864">Clients (one process per user)</text>

  <g>
    <rect x="40" y="105" width="320" height="140" rx="10" fill="#DEEBF7" stroke="#2E75B6" stroke-width="2"/>
    <text x="200" y="133" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F3864">ChatClient — "alice"</text>
    <rect x="58" y="148" width="284" height="38" rx="6" fill="#FFFFFF" stroke="#9DC3E6"/>
    <text x="200" y="173" text-anchor="middle" font-size="15" fill="#222">Main thread: keyboard → send</text>
    <rect x="58" y="194" width="284" height="38" rx="6" fill="#FFFFFF" stroke="#9DC3E6"/>
    <text x="200" y="219" text-anchor="middle" font-size="15" fill="#222">Listener thread: receive → print</text>
  </g>
  <g>
    <rect x="40" y="285" width="320" height="140" rx="10" fill="#DEEBF7" stroke="#2E75B6" stroke-width="2"/>
    <text x="200" y="313" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F3864">ChatClient — "bob"</text>
    <rect x="58" y="328" width="284" height="38" rx="6" fill="#FFFFFF" stroke="#9DC3E6"/>
    <text x="200" y="353" text-anchor="middle" font-size="15" fill="#222">Main thread: keyboard → send</text>
    <rect x="58" y="374" width="284" height="38" rx="6" fill="#FFFFFF" stroke="#9DC3E6"/>
    <text x="200" y="399" text-anchor="middle" font-size="15" fill="#222">Listener thread: receive → print</text>
    <!-- step 1 -->
    <circle cx="40" cy="347" r="15" fill="#C55A11"/>
    <text x="40" y="353" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFF">1</text>
  </g>
  <g>
    <rect x="40" y="465" width="320" height="140" rx="10" fill="#DEEBF7" stroke="#2E75B6" stroke-width="2"/>
    <text x="200" y="493" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F3864">ChatClient — "carol"</text>
    <rect x="58" y="508" width="284" height="38" rx="6" fill="#FFFFFF" stroke="#9DC3E6"/>
    <text x="200" y="533" text-anchor="middle" font-size="15" fill="#222">Main thread: keyboard → send</text>
    <rect x="58" y="554" width="284" height="38" rx="6" fill="#FFFFFF" stroke="#9DC3E6"/>
    <text x="200" y="579" text-anchor="middle" font-size="15" fill="#222">Listener thread: receive → print</text>
  </g>

  <!-- ================= NETWORK ================= -->
  <rect x="385" y="105" width="190" height="500" rx="10" fill="#F7F7F7" stroke="#BFBFBF" stroke-dasharray="6 5"/>
  <text x="480" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F3864">Network</text>
  <text x="480" y="630" text-anchor="middle" font-size="15" fill="#333">One TCP socket per client</text>
  <text x="480" y="652" text-anchor="middle" font-size="15" fill="#333">Plain (default) or TLS (--secure)</text>

  <!-- ================= SERVER ================= -->
  <rect x="600" y="60" width="770" height="625" rx="12" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>

  <!-- connections client <-> handler (drawn after the server box so both arrowheads show) -->
  <line x1="362" y1="175" x2="623" y2="175" stroke="#2E75B6" stroke-width="3" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line x1="362" y1="355" x2="623" y2="355" stroke="#2E75B6" stroke-width="3" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line x1="362" y1="535" x2="623" y2="535" stroke="#2E75B6" stroke-width="3" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <rect x="420" y="160" width="120" height="30" rx="5" fill="#FFFFFF"/>
  <text x="480" y="181" text-anchor="middle" font-size="15" fill="#2E75B6">port 8888</text>
  <rect x="420" y="340" width="120" height="30" rx="5" fill="#FFFFFF"/>
  <text x="480" y="361" text-anchor="middle" font-size="15" fill="#2E75B6">port 8888</text>
  <rect x="420" y="520" width="120" height="30" rx="5" fill="#FFFFFF"/>
  <text x="480" y="541" text-anchor="middle" font-size="15" fill="#2E75B6">port 8888</text>
  <text x="985" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F3864">ChatServer process (binds 0.0.0.0:8888)</text>

  <!-- handlers -->
  <text x="770" y="122" text-anchor="middle" font-size="15" font-style="italic" fill="#555">Thread pool: one ClientHandler per client</text>
  <g>
    <rect x="625" y="135" width="290" height="80" rx="10" fill="#E2F0D9" stroke="#548235" stroke-width="2"/>
    <text x="770" y="167" text-anchor="middle" font-size="17" font-weight="bold" fill="#375623">ClientHandler (alice)</text>
    <text x="770" y="193" text-anchor="middle" font-size="14" fill="#333">username → read lines → relay</text>
  </g>
  <g>
    <rect x="625" y="315" width="290" height="80" rx="10" fill="#E2F0D9" stroke="#548235" stroke-width="2"/>
    <text x="770" y="347" text-anchor="middle" font-size="17" font-weight="bold" fill="#375623">ClientHandler (bob)</text>
    <text x="770" y="373" text-anchor="middle" font-size="14" fill="#333">sanitise + tag with sender name</text>
    <circle cx="625" cy="315" r="15" fill="#C55A11"/>
    <text x="625" y="321" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFF">2</text>
  </g>
  <g>
    <rect x="625" y="495" width="290" height="80" rx="10" fill="#E2F0D9" stroke="#548235" stroke-width="2"/>
    <text x="770" y="527" text-anchor="middle" font-size="17" font-weight="bold" fill="#375623">ClientHandler (carol)</text>
    <text x="770" y="553" text-anchor="middle" font-size="14" fill="#333">username → read lines → relay</text>
  </g>

  <!-- accept loop -->
  <rect x="1010" y="110" width="330" height="95" rx="10" fill="#FFFFFF" stroke="#595959" stroke-width="2"/>
  <text x="1175" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Accept loop (main thread)</text>
  <text x="1175" y="167" text-anchor="middle" font-size="14" fill="#333">serverSocket.accept()</text>
  <text x="1175" y="189" text-anchor="middle" font-size="14" fill="#333">→ new ClientHandler on pool</text>
  <line x1="1008" y1="160" x2="919" y2="170" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="963" y="150" text-anchor="middle" font-size="13" fill="#555">spawns</text>

  <!-- registry -->
  <rect x="1010" y="250" width="330" height="215" rx="10" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/>
  <text x="1175" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#7F6000">ClientRegistry</text>
  <text x="1175" y="303" text-anchor="middle" font-size="14" fill="#333">ConcurrentHashMap&lt;username, handler&gt;</text>
  <rect x="1035" y="315" width="280" height="76" rx="6" fill="#FFFFFF" stroke="#E0C060"/>
  <text x="1050" y="337" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#222">"alice" → ClientHandler</text>
  <text x="1050" y="358" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#222">"bob"   → ClientHandler</text>
  <text x="1050" y="379" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#222">"carol" → ClientHandler</text>
  <text x="1175" y="418" text-anchor="middle" font-size="14" fill="#333">register(): putIfAbsent = unique names</text>
  <text x="1175" y="442" text-anchor="middle" font-size="14" fill="#333">broadcast(): send to every handler</text>
  <circle cx="1340" cy="250" r="15" fill="#C55A11"/>
  <text x="1340" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFF">3</text>

  <!-- handler -> registry (bob broadcasts) -->
  <line x1="917" y1="350" x2="1006" y2="350" stroke="#C55A11" stroke-width="3" marker-end="url(#arr)"/>
  <!-- registry -> handlers (send) -->
  <path d="M1008,290 L960,290 L960,195 L919,195" fill="none" stroke="#548235" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M1008,375 L960,375 L960,375 L919,375" fill="none" stroke="#548235" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M1008,440 L960,440 L960,555 L919,555" fill="none" stroke="#548235" stroke-width="2.5" marker-end="url(#arr)"/>
  <circle cx="960" cy="245" r="15" fill="#C55A11"/>
  <text x="960" y="251" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFF">4</text>

  <!-- message flow legend -->
  <rect x="1010" y="490" width="330" height="172" rx="10" fill="#FFFFFF" stroke="#C55A11" stroke-width="1.5"/>
  <text x="1030" y="516" font-size="16" font-weight="bold" fill="#C55A11">Message flow</text>
  <text x="1030" y="541" font-size="14" fill="#222">1  bob types a message</text>
  <text x="1030" y="563" font-size="14" fill="#222">2  his handler cleans it and adds his</text>
  <text x="1050" y="582" font-size="14" fill="#222">name from the server's own record</text>
  <text x="1030" y="604" font-size="14" fill="#222">3  registry broadcasts the line</text>
  <text x="1030" y="626" font-size="14" fill="#222">4  every handler sends it; each client's</text>
  <text x="1050" y="645" font-size="14" fill="#222">listener thread prints it</text>

  <!-- ================= COMMON ================= -->
  <rect x="40" y="700" width="1330" height="135" rx="12" fill="#EDE7F6" stroke="#7030A0" stroke-width="2"/>
  <text x="705" y="728" text-anchor="middle" font-size="18" font-weight="bold" fill="#4B1F70">common package — shared by client and server</text>
  <rect x="70" y="745" width="400" height="72" rx="8" fill="#FFFFFF" stroke="#B4A7D6"/>
  <text x="270" y="773" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Protocol</text>
  <text x="270" y="798" text-anchor="middle" font-size="14" fill="#333">handshake, commands, input validation</text>
  <rect x="500" y="745" width="400" height="72" rx="8" fill="#FFFFFF" stroke="#B4A7D6"/>
  <text x="700" y="773" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Transport</text>
  <text x="700" y="798" text-anchor="middle" font-size="14" fill="#333">creates every socket: PLAIN or TLS</text>
  <rect x="930" y="745" width="410" height="72" rx="8" fill="#FFFFFF" stroke="#B4A7D6"/>
  <text x="1135" y="773" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Args</text>
  <text x="1135" y="798" text-anchor="middle" font-size="14" fill="#333">--host, --port, --secure options</text>
</svg>
